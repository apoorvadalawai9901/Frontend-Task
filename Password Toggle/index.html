<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Toggle</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
		}

		form {
			width: min(100% - 2rem, 24rem);
			padding: 2rem;
			background: #ffffff;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
		}

		h1 {
			margin-top: 0;
			font-size: 1.5rem;
		}

		label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 600;
		}

		input[type="password"],
		input[type="text"] {
			box-sizing: border-box;
			width: 100%;
			padding: 0.75rem;
			border: 1px solid #9ca3af;
			border-radius: 4px;
			font-size: 1rem;
		}

		.toggle-button {
			margin: 0.75rem 0 1.25rem;
			background: #4b5563;
		}

		button {
			width: 100%;
			padding: 0.75rem;
			border: 0;
			border-radius: 4px;
			color: #ffffff;
			background: #2563eb;
			cursor: pointer;
			font-size: 1rem;
		}

		button:hover {
			background: #1d4ed8;
		}

		#message {
			min-height: 1.25rem;
			margin-bottom: 0;
			color: #166534;
		}
	</style>
</head>
<body>
	<form id="password-form">
		<h1>Enter your password</h1>

		<label for="password">Password</label>
		<input id="password" name="password" type="password" required>

		<button id="show-password" class="toggle-button" type="button" aria-pressed="false">
			Show password
		</button>

		<button type="submit">Submit</button>
		<p id="message" role="status" aria-live="polite"></p>
	</form>

	<script>
		const passwordInput = document.getElementById('password');
		const showPassword = document.getElementById('show-password');
		const passwordForm = document.getElementById('password-form');
		const message = document.getElementById('message');

		showPassword.addEventListener('click', () => {
			const isVisible = passwordInput.type === 'password';
			passwordInput.type = isVisible ? 'text' : 'password';
			showPassword.setAttribute('aria-pressed', String(isVisible));
			showPassword.textContent = isVisible ? 'Hide password' : 'Show password';
		});

		passwordForm.addEventListener('submit', (event) => {
			event.preventDefault();
			message.textContent = 'Password entered successfully.';
		});
	</script>
</body>
</html>
